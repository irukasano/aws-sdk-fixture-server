services:
  aws-fixture:
    build:
      context: .
    ports:
      - "${FIXTURE_HOST_PORT:-4566}:4566"
    volumes:
      - ./tests/aws/scenarios:/scenarios:ro
    healthcheck:
      test: ["CMD", "/aws-fixture-healthcheck"]
      interval: 1s
      timeout: 1s
      retries: 30

  javascript-sdk-tests:
    build:
      context: .
      dockerfile: tests/sdk/javascript/Dockerfile
    environment:
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_REGION: us-east-1
      AWS_ENDPOINT_URL: http://aws-fixture:4566
    depends_on:
      aws-fixture:
        condition: service_healthy

  python-sdk-tests:
    build:
      context: .
      dockerfile: tests/sdk/python/Dockerfile
    environment:
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_DEFAULT_REGION: us-east-1
      AWS_ENDPOINT_URL: http://aws-fixture:4566
    depends_on:
      aws-fixture:
        condition: service_healthy
