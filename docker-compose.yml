services:
  aws-fixture:
    build:
      context: .
    ports:
      - "4566:4566"
    volumes:
      - ./tests/aws/scenarios:/scenarios:ro

  javascript-sdk-tests:
    build:
      context: ./tests/sdk/javascript
    environment:
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_REGION: us-east-1
      AWS_ENDPOINT_URL: http://aws-fixture:4566
    depends_on:
      - aws-fixture

  python-sdk-tests:
    build:
      context: ./tests/sdk/python
    environment:
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_DEFAULT_REGION: us-east-1
      AWS_ENDPOINT_URL: http://aws-fixture:4566
    depends_on:
      - aws-fixture
